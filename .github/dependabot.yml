version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { frontend: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups: { docs: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups: { backend: { patterns: ["*"] } }
