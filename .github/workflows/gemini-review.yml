name: Gemini review

# Advisory: posts a code review on every PR. Not a required check.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skip cleanly until the GEMINI_API_KEY secret exists: gh secret set GEMINI_API_KEY
      - id: key
        run: |
          present=${{ secrets.GEMINI_API_KEY != '' }}
          echo "present=$present" >> "$GITHUB_OUTPUT"
          [ "$present" = true ] || echo "::notice::GEMINI_API_KEY not set; skipping Gemini review"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      # ponytail: gh runs outside the model. Inside Gemini's shell tool it had no token and the model fell back to flailing with git.
      - if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff
      - id: gemini
        if: steps.key.outputs.present == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review the pull request diff in the file pr.diff. Read other files in the repo only when a hunk is not enough on its own.
            Report only bugs, security issues, and behaviour regressions you are confident about, at most 5, each with file:line and a one-line fix. If there are none, say so in one line.
            Reply with the review in markdown and nothing else.
          settings: '{"maxSessionTurns": 10, "coreTools": ["read_file"]}'
      - if: steps.key.outputs.present == 'true' && steps.gemini.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.gemini.outputs.summary }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"
