name: Gemini review

# Advisory: posts a code review on every PR. Not a required check.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skip cleanly until the GEMINI_API_KEY secret exists: gh secret set GEMINI_API_KEY
      - id: key
        run: |
          present=${{ secrets.GEMINI_API_KEY != '' }}
          echo "present=$present" >> "$GITHUB_OUTPUT"
          [ "$present" = true ] || echo "::notice::GEMINI_API_KEY not set; skipping Gemini review"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Mirrors google-github-actions/run-gemini-cli/examples/workflows/pr-review: the code-review
      # extension reads the PR and posts inline review threads through the GitHub MCP server.
      - if: steps.key.outputs.present == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_debug: true
          github_pr_number: ${{ github.event.pull_request.number }}
          extensions: '["https://github.com/gemini-cli-extensions/code-review"]'
          prompt: /pr-code-review
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["add_comment_to_pending_review", "pull_request_read", "pull_request_review_write"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              }
            }
