name: Gemini review

# Advisory: posts a code review on every PR. Not a required check.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skip cleanly until the GEMINI_API_KEY secret exists: gh secret set GEMINI_API_KEY
      - id: key
        run: |
          present=${{ secrets.GEMINI_API_KEY != '' }}
          echo "present=$present" >> "$GITHUB_OUTPUT"
          [ "$present" = true ] || echo "::notice::GEMINI_API_KEY not set; skipping Gemini review"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.key.outputs.present == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_debug: true
          # ponytail: plain gh calls instead of the code-review extension + docker GitHub MCP server, which hung the runner.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff. Read surrounding files with cat only when the hunk is not enough.
            Report only bugs, security issues, and behaviour regressions you are confident about, at most 5, each with file:line and a one-line fix. If there are none, say so in one line.
            Post the result as a single comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file review.md` and stop.
          settings: |-
            {
              "maxSessionTurns": 25,
              "coreTools": [
                "run_shell_command(gh pr diff)",
                "run_shell_command(gh pr comment)",
                "run_shell_command(cat)",
                "run_shell_command(grep)",
                "write_file"
              ]
            }
