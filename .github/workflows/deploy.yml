name: Deploy non-production

# Runs only after the CI workflow succeeds on a push to develop.
# Frontend hosting moves to Cloudflare Pages in sub-project 2 of the Cloudflare
# migration (docs/decisions/cloudflare-architecture.md); until then only the
# backend deploys, to Render staging. Per-branch previews arrive with the migration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  staging:
    name: Deploy staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy backend to Render staging
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$RENDER_STAGING_DEPLOY_HOOK"
