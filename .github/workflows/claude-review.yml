name: Claude review

# Advisory: posts a confidence-filtered code review on every PR. Not a required check.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # Skip cleanly until the ANTHROPIC_API_KEY secret exists: gh secret set ANTHROPIC_API_KEY
      - id: key
        run: |
          present=${{ secrets.ANTHROPIC_API_KEY != '' }}
          echo "present=$present" >> "$GITHUB_OUTPUT"
          [ "$present" = true ] || echo "::notice::ANTHROPIC_API_KEY not set; skipping Claude review"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
